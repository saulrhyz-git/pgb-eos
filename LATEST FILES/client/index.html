<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw under the notch/dynamic-
         island/home-indicator on iOS instead of leaving the system's own
         (light-colored) letterboxing there, which is what showed up as a
         white strip on mobile — see the safe-area-inset padding this
         enables in Layout.tsx and index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/EOS-logo.png" />
    <title>EOS Executive Dashboard</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
